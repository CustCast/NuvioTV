name: Build Test APK

on:
  workflow_dispatch: # Allows you to trigger this manually with a single click

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Temporary Testing Keystore
        run: |
          keytool -genkey -v -keystore local_test_keystore.jks \
            -storepass temp_password123 -alias temp_alias -keypass temp_password123 \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Nuvio Test Build, O=Testing, C=US"

      - name: Compile Full Debug APK
        env:
          NUVIO_RELEASE_STORE_FILE: "${{ github.workspace }}/local_test_keystore.jks"
          NUVIO_RELEASE_KEY_ALIAS: "temp_alias"
          NUVIO_RELEASE_KEY_PASSWORD: "temp_password123"
          NUVIO_RELEASE_STORE_PASSWORD: "temp_password123"
        run: ./gradlew :app:assembleFullDebug -x lintVitalFullDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-deeplink-test
          path: app/build/outputs/apk/full/debug/*.apk
